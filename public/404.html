<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Word Leren</title>
    <script>
      // Redirect to index.html preserving the path as a query param
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // 1 for project pages (/word-leren/)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search
            ? "&" + l.search.slice(1).replace(/&/g, "~and~")
            : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
