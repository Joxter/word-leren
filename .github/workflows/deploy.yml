name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets the deploy be started by hand (`gh workflow run deploy.yml`, or the
  # Run workflow button). Needed whenever a push left no usable event behind —
  # e.g. it landed while Actions was down, so no run was ever created for it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_INSTANT_APP_ID: ${{ secrets.VITE_INSTANT_APP_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
