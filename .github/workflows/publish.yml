# Build the MCP server image on GitHub and publish it to ghcr.io, so the droplet
# only ever pulls. Same shape as sfw-game's pipeline. See docs/deploy.md.
name: publish

on:
  push:
    branches: [master]
  workflow_dispatch:

# Two pushes in quick succession would otherwise race, and whichever finishes
# last wins the `latest` tag. Deploys pin by sha and don't care, but compose
# falls back to `latest`.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    # Publishing an image that fails its own tests just moves the breakage to
    # the droplet, where noticing it costs a deploy.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Enough to push to packages owned by this repo, so publishing needs
          # no secret of its own. Pulling on the droplet uses the PAT that is
          # already in /root/.docker/config.json for the neighbouring project.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Lower case spelled out: the owner is "Joxter" and registry paths
          # must be lower case.
          tags: |
            ghcr.io/joxter/word-leren/mcp:${{ github.sha }}
            ghcr.io/joxter/word-leren/mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
